# Local release analysis. Keep source and test scope explicit; do not suppress security rules.
# lib and public are recursive, so every 1.5 module directory (lib/audit, lib/db, lib/identity,
# lib/notify, lib/repo and the others; public/modules and public/shared) is in scope. SQL lives
# in tagged sql templates under lib and Sonar has no rules for it here, so npm run lint:sql and
# lint:imports remain separate gate stages.
sonar.projectKey=orbit-homelab
sonar.projectName=Orbit
sonar.sourceEncoding=UTF-8
sonar.sources=server.mjs,lib,public,scripts,deploy,Dockerfile,compose.yaml,compose.secret.yaml,package.json,package-lock.json,.env.example,.github
sonar.tests=test
sonar.javascript.file.suffixes=.js,.mjs
sonar.scm.provider=git
