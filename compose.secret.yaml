# Lines that start with '#' and three spaces are commands: copy each without its '#' and the
# spaces. None ends in a comment, since a zsh without interactivecomments (its default) runs a
# trailing '# ...' as more words. "On a Linux host only" marks a command a Mac skips (see the
# end of these notes); every other line is a note.
# Name this override in .env, so that EVERY later docker compose command includes it (updates,
# rollbacks, settings changes, goblin-admin); a command with compose.yaml alone recreates the
# container without the key, and once the volume's copy is gone every start exits 78:
#   echo 'COMPOSE_FILE=compose.yaml:compose.secret.yaml' >> .env
# (or give -f compose.yaml -f compose.secret.yaml to every command).
# A compose.override.yaml (it holds cpus: 0 and cpuset: '0' where Docker refuses any limit on
# CPU time: docs/troubleshooting.md) is read by Compose itself only for a command given no -f
# while .env sets no COMPOSE_FILE. With one, write this line in place of each COMPOSE_FILE line
# below (the last such line in .env counts): COMPOSE_FILE=compose.yaml:compose.secret.yaml:compose.override.yaml
# and add -f compose.override.yaml after -f compose.yaml in the check and in the COPY and MOVE
# commands; otherwise they run without it, so with compose.yaml's cpus: 1, which Docker refuses
# on such a host.
# Every up -d in these notes recreates a running Uptime Goblin's container, and Docker discards its
# log, which holds the audit log's checkpoint lines: keep it first, appending it to a private
# file outside the volume with this line (docs/installation.md, Keeping Uptime Goblin's log). It copies
# a file that is there already into a new one only you can open before it adds to it (a program
# that opened the old one while it was readable reads nothing added), and never writes through
# a link. On a Mac, an access list entry the folder hands down to new files (file_inherit in
# ls -led) reaches the new one too: keep the file in a folder with none. When it prints "Uptime Goblin's
# log was not kept", it kept nothing, or only part of the log: run up -d only once it is kept.
#   (umask 077 && f=~/uptime-goblin-journal.txt && test ! -L "$f" && touch "$f" && test -f "$f" && n=$(mktemp "$f.XXXXXX") && { cat "$f" >> "$n" && mv -f "$n" "$f" || { rm -f "$n"; false; }; } && docker compose logs --no-log-prefix uptime-goblin >> "$f") || { echo "Uptime Goblin's log was not kept"; false; }
# WHICH RECIPE: what the volume holds decides, not the release running now. On an install that
# has run before, ask before you make or copy a key. With the 1.5 image built (docker compose build
# --pull), the check compares orbit_secret_key (it adds this file when that exists, to mount it)
# and /var/lib/uptime-goblin/secret.key with the data and changes nothing; its first line is NEW, KEEP, COPY,
# MOVE or RESTORE, the next says why, and after KEEP a third line can be a command to run (see
# KEEP). Nothing else means the check did not run, or it names a file it cannot read:
#   docker compose -f compose.yaml $(test -e orbit_secret_key && echo '-f compose.secret.yaml') run --rm --no-deps uptime-goblin node lib/cli/goblin-admin.mjs key compose-check
# KEEP: orbit_secret_key opens the data: 1.5 has run on this volume WITH this override (also
# when 1.4.x runs on it again after a rollback), or the data moved to that key (key rewrap).
# Make no key and copy none: keep orbit_secret_key and COMPOSE_FILE (a new key cannot open that
# data: exit 78). A /var/lib/uptime-goblin/secret.key still in the volume is not the key Uptime Goblin uses, and
# every copy of the volume carries it: the check's third line is the command that deletes it,
# to run once Uptime Goblin runs with this override. A copy of your key goes with the copy recipe's last
# line; an older key (after key rewrap) with this line, which deletes it only while Uptime Goblin's key
# opens every data key and that file opens none, and otherwise says why and deletes nothing:
#   docker compose exec uptime-goblin node lib/cli/goblin-admin.mjs key remove-data-copy --unused
# COPY: no orbit_secret_key, and /var/lib/uptime-goblin/secret.key opens the data: 1.5 has run on this volume
# without this override, also when 1.4.x runs on it again after a rollback (1.4.x leaves
# secret.key alone). Take the copy recipe below.
# MOVE: orbit_secret_key does not open the data, and /var/lib/uptime-goblin/secret.key does (a new key made
# for a volume that needed COPY). Take the last recipe below.
# RESTORE: no key here opens the data. Make no key and copy none: put back the orbit_secret_key
# the data was sealed with and run the check again (truly lost: 'Lost encryption key' in
# docs/troubleshooting.md).
# A NEW install, or a volume ONLY 1.4.x HAS RUN ON (NEW: 1.4.x data has no key, so 1.5 seals
# it with this one at its first start); the first line never replaces a key file you have, and
# makes the key under umask 077, so the file is private from its first byte:
#   test -e orbit_secret_key && echo 'orbit_secret_key exists: keep it' || { (umask 077 && openssl rand -hex 32 > orbit_secret_key) && chmod 0400 orbit_secret_key; }
# On a Linux host only:
#   sudo chown 1000 orbit_secret_key
# Then name this override in .env and start:
#   echo 'COMPOSE_FILE=compose.yaml:compose.secret.yaml' >> .env
#   docker compose up -d
# A volume 1.5 HAS RUN ON without this override (COPY) keeps the key it generated there (a new
# one cannot open that data: exit 78, and the refusal names /var/lib/uptime-goblin/secret.key). The first
# command never replaces a key file you have. It reads that key with a container of its own,
# in the 1.5 image like the check, into a new file (not with docker compose cp, which reads
# through Uptime Goblin's container and fails while that container mounts an orbit_secret_key that is
# gone); goblin-admin checks that the file holds a key that opens the data, and only then is it
# copied to orbit_secret_key. Otherwise it says "Stopped before the end" and copies nothing:
#   test -e orbit_secret_key && echo 'orbit_secret_key exists: not replaced; run the check' || {
#     volume_key=$(mktemp orbit_secret_key.XXXXXX) &&
#     docker compose -f compose.yaml run --rm --no-deps -T uptime-goblin cat /var/lib/uptime-goblin/secret.key >| "$volume_key" &&
#     test -s "$volume_key" &&
#     docker compose -f compose.yaml run --rm --no-deps -T uptime-goblin sh -c 'umask 077 && cat > /tmp/key && GOBLIN_SECRET_KEY_FILE=/tmp/key node lib/cli/goblin-admin.mjs key status > /dev/null' < "$volume_key" &&
#     cp "$volume_key" orbit_secret_key && chmod 0400 orbit_secret_key && rm -f "$volume_key" ||
#     { rm -f "$volume_key"; echo 'Stopped before the end: run the check'; false; }
#   }
# On a Linux host only:
#   sudo chown 1000 orbit_secret_key
# Then keep Uptime Goblin's log as above, name this override in .env (first: every command after it
# needs it) and start; the "Encryption key:" start line names the Compose secret with the same
# fingerprint as before, and the config lists the secret, which later commands mount too. The
# last command deletes the copy in the volume only while Uptime Goblin's key is the Compose secret,
# holding the same key, and opens the data; otherwise it says why and deletes nothing:
#   echo 'COMPOSE_FILE=compose.yaml:compose.secret.yaml' >> .env
#   docker compose up -d
#   docker compose logs uptime-goblin | grep 'Encryption key'
#   docker compose config | grep orbit_secret_key
#   docker compose exec uptime-goblin node lib/cli/goblin-admin.mjs key remove-data-copy
# A volume that needed COPY and was GIVEN A NEW KEY (MOVE): Uptime Goblin refuses (exit 78) and starts
# again and again, in a container that mounts your orbit_secret_key. The first command reads the
# volume's key and checks it as the copy recipe does, before it changes any file; only then does
# it set your file aside, kept as orbit_secret_key.unused (never replacing one; a copy, then the
# file removed: on OrbStack a new container could still mount a renamed file for a while, and
# Docker Desktop was not tested), and copy the volume's key to a new orbit_secret_key:
#   test -e orbit_secret_key.unused && echo 'orbit_secret_key.unused exists: not replaced; choose another name' || {
#     volume_key=$(mktemp orbit_secret_key.XXXXXX) &&
#     docker compose -f compose.yaml run --rm --no-deps -T uptime-goblin cat /var/lib/uptime-goblin/secret.key >| "$volume_key" &&
#     test -s "$volume_key" &&
#     docker compose -f compose.yaml run --rm --no-deps -T uptime-goblin sh -c 'umask 077 && cat > /tmp/key && GOBLIN_SECRET_KEY_FILE=/tmp/key node lib/cli/goblin-admin.mjs key status > /dev/null' < "$volume_key" &&
#     cp -p orbit_secret_key orbit_secret_key.unused && rm -f orbit_secret_key &&
#     cp "$volume_key" orbit_secret_key && chmod 0400 orbit_secret_key && rm -f "$volume_key" ||
#     { rm -f "$volume_key"; echo 'Stopped before the end: run the check'; false; }
#   }
# On a Linux host only:
#   sudo chown 1000 orbit_secret_key
# Then, with COMPOSE_FILE set as above (the last such line in .env counts), start Uptime Goblin in
# a new container, after those lines: up -d --force-recreate, since a plain up -d could keep the
# container that refused, whose configuration is the same. Keep Uptime Goblin's log first, as above.
# The "Encryption key:" start line names the Compose secret with the fingerprint the check gave
# for /var/lib/uptime-goblin/secret.key, and the last command deletes the copy in the volume only while
# Uptime Goblin's key is the Compose secret, holding the same key, and opens the data; otherwise it says
# why and deletes nothing:
#   echo 'COMPOSE_FILE=compose.yaml:compose.secret.yaml' >> .env
#   docker compose up -d --force-recreate
#   docker compose logs uptime-goblin | grep 'Encryption key'
#   docker compose config | grep orbit_secret_key
#   docker compose exec uptime-goblin node lib/cli/goblin-admin.mjs key remove-data-copy
# The image runs as uid 1000 (node), which must be able to read the file. Compose mounts it with
# the host's owner and mode (0400), so on a Linux host the chown in each recipe comes before
# the first start: without it every start exits 78 (key_file_unreadable, EACCES). On a Mac,
# OrbStack (where these recipes were measured) lets the container's user read the file as it
# is, so skip the chown there; Docker Desktop was not tested. On a Linux host without Docker's
# user-namespace remapping, uid 1000 is a host uid too, often the first person's account, which
# then owns and can read the key file, and Uptime Goblin's processes (Docker's init and Node, which hold
# no capabilities) run as it, with gid 1000: while Uptime Goblin runs, any process of host uid 1000 that
# runs with gid 1000 too (as the processes of a login whose own group is gid 1000 do) can read
# the mounted key through /proc/<pid>/root/run/secrets/orbit_secret_key and the GOBLIN_PASSWORD
# Uptime Goblin started with through /proc/<pid>/environ, and read and change Uptime Goblin's data volume through
# /proc/<pid>/root/var/lib/uptime-goblin (measured with Docker 29.4.0 on OrbStack, at /app/data
# before 1.5). Keeping this directory root's (mode 0700) keeps only the files from being opened by
# their paths. What keeps
# the key from that account is a host where uid 1000 is no one's (or userns-remap, not measured
# with these recipes: the chown must then name the remapped uid); root, and every account that
# can use Docker (docker exec), can read it in any case. With a root-only directory, run every
# command here, and every docker compose command, as root in it (docs/installation.md,
# Encryption key).
services:
  uptime-goblin:
    secrets:
      - orbit_secret_key
secrets:
  orbit_secret_key:
    file: ./orbit_secret_key
