name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One job per kind of check, each with its own time budget. A release needs every job green on
# the tagged commit. TEST_REQUIRE turns a missing browser, fixture, systemd image, Docker
# daemon or Git into a failure instead of a skip (see test/setup.mjs); the npm scripts together run
# every test file exactly once (test/packaging.test.mjs checks that). The tests that start from a
# release tag or milestone of the project's history need the private history input (TEST_HISTORY),
# which public CI does not have: they skip here, and the private historical qualification
# (docs/engineering-quality.md) runs them with TEST_REQUIRE=history, where a missing or wrong input
# fails.
jobs:
  checks:
    name: Format, syntax, unit and integration tests
    runs-on: ubuntu-latest
    # Measured on a GitHub-hosted runner (4 CPUs): npm run test:fast took 18 min 8 s of a 18 min
    # 39 s job (run 45050291190); 10 minutes stopped it two-thirds through. 30 leaves headroom.
    timeout-minutes: 30
    env:
      TEST_REQUIRE: git
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check formatting
        run: npm run format:check
      - name: Check the manifest, its imports and JavaScript syntax
        run: npm run check
      - name: Run unit and integration tests
        run: npm run test:fast
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Verify registry signatures of installed packages
        run: npm audit signatures

  browser:
    name: Browser tests against a real server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_REQUIRE: browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Show the browser under test
        run: google-chrome --version
      - name: Run browser tests
        run: npm run test:browser

  upgrade:
    name: Upgrade and rollback simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_REQUIRE: fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run the upgrade simulation
        run: npm run test:upgrade

  installer:
    name: Installer with a fake systemctl and real systemd
    runs-on: ubuntu-latest
    # Measured on GitHub-hosted runners: 22m50s to 24m56s for this job (runs 45047270335,
    # 45050291190, 45053488924), so 25 minutes left no margin. 40 keeps a hung test bounded.
    timeout-minutes: 40
    env:
      TEST_REQUIRE: systemd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build the Debian 13 systemd test image
        run: docker build --pull -t orbit-installer-systemd:debian13 -f test/installer/systemd.Dockerfile test/installer
      - name: Run installer tests
        run: npm run test:installer

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_REQUIRE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      # One test runs the source tree with its installed dependencies (node_modules) in a
      # container beside the image, so the job installs them as the other jobs do.
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build, run and health-check the image
        run: npm run test:docker
